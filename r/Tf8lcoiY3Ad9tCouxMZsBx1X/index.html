<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Link expired</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0a1628;
    --green: #00c97a;
    --light: #f2f5f9;
    --muted: #5a6a85;
    --white: #ffffff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--light);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    background: var(--white);
    border-radius: 12px;
    box-shadow: 0 4px 40px rgba(0,0,0,0.08);
    padding: 40px 28px;
    max-width: 420px;
    text-align: center;
  }
  .logo-text {
    font-family: 'Playfair Display', serif;
    color: var(--navy);
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 24px;
  }
  h1 {
    font-family: 'Playfair Display', serif;
    font-size: 22px;
    color: var(--navy);
    margin-bottom: 12px;
  }
  p {
    font-size: 14px;
    color: var(--muted);
    line-height: 1.6;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="logo-text">High Ticket Sales Academy</div>
    <h1>This link has expired</h1>
    <p>This private page is no longer available. If you need help, contact CJ directly.</p>
  </div>
</body>
</html>
