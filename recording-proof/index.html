<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a1628">
<meta property="og:type" content="website">
<meta property="og:url" content="https://closewithcjclay.com/recording-proof/">
<meta property="og:title" content="Recording · HTSA">
<meta property="og:description" content="A short recording for you to listen to.">
<meta property="og:image" content="https://closewithcjclay.com/r/og-precall.jpg">
<title>Recording | HTSA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0a1628; --navy-soft:#152a46; --green:#61e38b; --green-strong:#00c97a;
  --grey-light:#f3f6f9; --text:#17243b; --muted:#54637a; --white:#fff;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  min-width:320px;min-height:100dvh;display:flex;align-items:center;justify-content:center;
  padding:24px 16px;color:var(--text);font-family:"DM Sans",sans-serif;line-height:1.55;
  background:radial-gradient(circle at 78% 12%,rgba(97,227,139,.16),transparent 22rem),
             linear-gradient(155deg,var(--navy),var(--navy-soft));
  -webkit-font-smoothing:antialiased;
}
.card{
  width:min(480px,100%);padding:28px 24px 24px;border:1px solid rgba(97,227,139,.28);
  border-radius:18px;background:rgba(255,255,255,.96);box-shadow:0 24px 60px rgba(0,0,0,.28);
}
.tag{
  display:inline-block;margin-bottom:12px;padding:4px 11px;border-radius:999px;
  background:rgba(0,201,122,.14);color:#087b50;font-size:12px;font-weight:800;
  letter-spacing:.08em;text-transform:uppercase;
}
h1{
  color:var(--navy);font-family:"Playfair Display",serif;
  font-size:clamp(1.45rem,5vw,1.85rem);line-height:1.2;
}
.lede{margin-top:10px;color:var(--muted);font-size:15px}
.player{
  margin-top:20px;padding:14px;border:1px solid rgba(10,22,40,.08);
  border-radius:14px;background:#f7faf8;
}
audio{display:block;width:100%}
.note{margin-top:14px;color:var(--muted);font-size:13px;line-height:1.5}
</style>
</head>
<body>
  <main class="card">
    <div class="tag">Private recording</div>
    <h1>Hit play when you are ready</h1>
    <p class="lede">This is a short call recording shared so you can hear a real conversation. Take your time with it.</p>
    <div class="player">
      <audio controls preload="metadata" controlsList="nodownload">
        <source src="/media/recording-proof.mp3" type="audio/mpeg">
        Your browser does not support audio playback.
      </audio>
    </div>
    <p class="note">About 13 minutes. If it does not load, refresh once and try again.</p>
  </main>
</body>
</html>
